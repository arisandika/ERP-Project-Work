name: 🚀 Deploy Laravel (SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Build asset di GitHub Actions
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Filament assets
        run: npm run build:filament

      # Deploy ke server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e

            cd ~/public_html/domains/erp.toondangan.com

            echo "📦 Pull latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main

            echo "🧰 Install Composer dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "🧹 Clear Laravel caches..."
            php artisan optimize:clear

            echo "🗄️ Run migrations..."
            php artisan migrate --force

            echo "🛡️ Generate Shield permissions..."
            php artisan shield:generate --all || true

            echo "⚡ Optimize Laravel..."
            php artisan optimize

            echo "✅ Deploy finished!"
