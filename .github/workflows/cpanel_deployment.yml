name: Build and Deploy to Rumahweb via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup PHP & Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # Step 3: Install Composer dependencies
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      # Step 4: Setup Node.js and build Filament assets
      - name: Build Filament assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          npm run build:filament

      # Step 5: Deploy via SFTP
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          local_path: ./ 
          remote_path: /home/arihu975/public_html/domains/erp.arihub.my.id/
          sftp_only: true
          exclude: |
            **/.git*
            **/.github*
            node_modules/**
            tests/**
            storage/logs/**
            storage/framework/**
