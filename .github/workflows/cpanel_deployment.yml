name: 🚀 Deploy Laravel (SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2223
          script: |
            cd ~/public_html/domains/erp.arihub.my.id

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🧰 Installing composer dependencies..."
            ~/bin/composer install --no-dev --optimize-autoloader

            echo "📦 Installing npm dependencies..."
            ~/.nvm/versions/node/v24.3.0/bin/npm ci

            echo "🧩 Building Filament assets..."
            ~/.nvm/versions/node/v24.3.0/bin/npm run build:filament

            echo "🚀 Running Laravel optimizations..."
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
