name: Deploy via SFTP to Rumahweb
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Ambil source code dari branch main
      - uses: actions/checkout@v4

      # 2️⃣ Build aset frontend
      - name: Build assets
        run: npm install && npm run build:filament

      # 3️⃣ Install PHP dan Composer
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4️⃣ Deploy via SFTP (port 22)
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          local_path: './public'
          remote_path: '/home/arihu975/public_html/domains/erp.arihub.my.id'
          sftp_only: true
