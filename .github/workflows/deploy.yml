name: 🚀 Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd /var/www/erp

            echo "📦 Pull latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "🧰 Install Composer dependencies (PHP 8.3)..."
            /usr/bin/php8.3 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Install & build frontend assets..."
            npm ci
            npm run build

            echo "🧹 Clear old cache..."
            /usr/bin/php8.3 artisan config:clear
            /usr/bin/php8.3 artisan cache:clear
            /usr/bin/php8.3 artisan view:clear
            /usr/bin/php8.3 artisan route:clear

            echo "🗄️ Run migrations..."
            /usr/bin/php8.3 artisan migrate --force

            echo "🔐 Fix permissions..."
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo find storage -type d -exec chmod 775 {} \;
            sudo find storage -type f -exec chmod 664 {} \;
            sudo find bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find bootstrap/cache -type f -exec chmod 664 {} \;

            echo "⚡ Optimize (config, route, view cache)..."
            /usr/bin/php8.3 artisan optimize

            echo "🔄 Restart PHP-FPM & Apache..."
            sudo systemctl restart php8.3-fpm
            sudo systemctl reload apache2

            echo "✅ Deploy finished!"
